<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>효섭이 생일</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
<style>
  :root {
    --bg: #fff; --card: #f5f5f7; --ink: #191919; --sub: #8b8b8b; --line: #ececec;
    --accent: #ff4f7b; --accent-soft: #fff0f3;
    --ios-green: #34c759; --ios-red: #ff3b30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink); letter-spacing: -.2px;
    overflow-x: hidden;
  }
  img { display: block; max-width: 100%; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  .hidden { display: none !important; }
  .app { max-width: 430px; min-height: 100dvh; margin: 0 auto; position: relative; }

  /* ---------- iOS call ---------- */
  #call {
    position: fixed; inset: 0; z-index: 50; color: #fff;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 64px) 24px calc(env(safe-area-inset-bottom) + 48px);
    background: radial-gradient(120% 80% at 50% 0%, #4a4e69 0%, #22223b 45%, #0b0b14 100%);
    font-family: -apple-system, 'SF Pro Display', 'Apple SD Gothic Neo', sans-serif;
  }
  #call::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 40% at 30% 70%, rgba(255,43,214,.18), transparent 70%),
                radial-gradient(50% 40% at 80% 30%, rgba(0,240,255,.14), transparent 70%);
    backdrop-filter: blur(30px);
  }
  #call > *, #incoming > * { position: relative; }
  .call-sub { font-size: 17px; opacity: .7; }
  .call-name { font-size: 34px; font-weight: 500; margin: 6px 0 4px; letter-spacing: -.5px; text-align: center; }
  .avatar {
    width: 128px; height: 128px; border-radius: 50%; margin-top: 32px;
    display: grid; place-items: center; font-size: 44px; font-weight: 600;
    background: linear-gradient(180deg, #a5a5ad, #6e6e76) center/cover; color: #fff;
    box-shadow: 0 0 0 0 rgba(255,255,255,.35); animation: ring 1.6s infinite;
  }
  .avatar.sm { width: 88px; height: 88px; font-size: 32px; margin: 0 0 16px; animation: none; }
  @keyframes ring { 70% { box-shadow: 0 0 0 22px rgba(255,255,255,0); } 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } }
  .ic { width: 26px; height: 26px; }
  .glass-row { display: flex; gap: 56px; margin-top: auto; margin-bottom: 36px; font-size: 13px; }
  .glass-row button { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .glass-row b {
    width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.18); backdrop-filter: blur(20px);
  }
  .glass-row .red b { background: var(--ios-red); }
  .slider {
    position: relative; width: 100%; height: 76px; border-radius: 99px; padding: 6px;
    background: rgba(255,255,255,.16); backdrop-filter: blur(20px); touch-action: none; user-select: none;
  }
  .slider span {
    position: absolute; inset: 0; display: grid; place-items: center; padding-left: 56px; font-size: 20px;
    background: linear-gradient(90deg, rgba(255,255,255,.35) 0 40%, #fff 50%, rgba(255,255,255,.35) 60% 100%) 0 0/300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 2.4s linear infinite;
  }
  @keyframes shine { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .knob {
    position: relative; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
    background: #fff; color: var(--ios-green); cursor: grab;
  }
  .knob.back { transition: transform .25s; }
  #ongoing { display: flex; flex-direction: column; align-items: center; width: 100%; flex: 1; }
  .timer { font-size: 17px; opacity: .8; font-variant-numeric: tabular-nums; }
  .subtitle {
    margin-top: 24px; min-height: 120px; padding: 16px 18px; width: 100%;
    background: rgba(255,255,255,.1); border-radius: 18px; backdrop-filter: blur(24px);
    font-size: 17px; line-height: 1.5;
  }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px 28px; margin-top: auto; }
  .keypad span { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; }
  .keypad b {
    width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(255,255,255,.14); backdrop-filter: blur(20px);
  }
  .end-btn { margin-top: 28px; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--ios-red); color: #fff; }
  .down { transform: rotate(135deg); }

  /* 잠금화면: 첫 터치로 소리 권한을 얻은 뒤 전화가 울리게 */
  #lock {
    position: fixed; inset: 0; z-index: 55; color: #fff; cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 72px) 24px calc(env(safe-area-inset-bottom) + 56px);
    background: radial-gradient(120% 80% at 50% 0%, #4a4e69 0%, #22223b 45%, #0b0b14 100%);
    font-family: -apple-system, 'SF Pro Display', 'Apple SD Gothic Neo', sans-serif;
  }
  .lock-date { font-size: 20px; font-weight: 500; opacity: .85; }
  .lock-time { font-size: 88px; font-weight: 700; letter-spacing: -2px; line-height: 1; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .lock-hint { margin-top: auto; font-size: 15px; opacity: .7; animation: soft-blink 1.6s ease-in-out infinite; }
  @keyframes soft-blink { 50% { opacity: .25; } }

  /* reject popup */
  #reject {
    position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px);
  }
  .reject-card {
    width: 100%; max-width: 320px; border-radius: 22px; overflow: hidden; background: var(--card);
    box-shadow: 0 20px 50px rgba(0,0,0,.35); animation: shake .35s 2;
  }
  .reject-card img { width: 100%; aspect-ratio: 4 / 5; max-height: 55dvh; object-fit: cover; object-position: 50% 25%; }
  .reject-card p { font-size: 18px; font-weight: 700; text-align: center; padding: 18px 16px 6px; }
  .reject-card button {
    display: block; width: calc(100% - 32px); margin: 12px 16px 16px; padding: 14px; border-radius: 14px;
    background: var(--ios-green); color: #fff; font-size: 16px; font-weight: 700;
  }
  @keyframes shake { 25% { transform: translateX(-6px) rotate(-1deg); } 75% { transform: translateX(6px) rotate(1deg); } }

  /* ---------- rush overlay ---------- */
  #rush { position: fixed; inset: 0; z-index: 70; background: var(--bg); display: grid; place-items: center; padding-bottom: 60px; overflow: hidden; }
  .rush-zoom { transform: scale(.1); }
  .rush-flip.m { transform: scaleX(-1); }
  .rush-flip img { width: 180px; }
  .party { position: absolute; inset: 0; max-width: 430px; margin: 0 auto; pointer-events: none; }
  .party img { position: absolute; }
  .p-text {
    position: absolute; top: calc(env(safe-area-inset-top) + 40px); left: 0; right: 0; text-align: center;
    font-size: 44px; font-weight: 800; line-height: 1.1; letter-spacing: -1.5px;
    animation: hbd-in .6s cubic-bezier(.3, 1.6, .5, 1) backwards;
  }
  .p-text em { display: block; font-style: normal; color: var(--accent); }
  .p-cake { top: 56%; left: 50%; translate: -50% 0; width: min(56%, 230px); animation: hbd-in .5s .15s cubic-bezier(.3, 1.6, .5, 1) backwards; }
  .p-throw { top: 34%; left: -6px; width: min(40%, 168px); transform-origin: 20% 100%; animation: p-in-left .5s .3s backwards, p-nadae 2.4s .8s infinite; }
  @keyframes hbd-in { from { transform: scale(0) rotate(-25deg); opacity: 0; } }
  @keyframes p-in-left { from { transform: translateX(-120%); } }
  /* 폴짝폴짝 나대다가 가운데로 케이크 던지기 */
  @keyframes p-nadae {
    0%, 20%, 40%, 78%, 100% { transform: none; }
    10% { transform: translateY(-20px) rotate(-7deg); }
    30% { transform: translateY(-20px) rotate(7deg); }
    52% { transform: translate(-8px, 4px) rotate(-10deg); }
    62% { transform: translate(80px, -24px) rotate(16deg) scale(1.3); }
  }
  .btn.rush-go {
    position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 32px);
    width: min(calc(100% - 48px), 382px); margin: 0 auto; pointer-events: auto; animation: hbd-in .5s 1.2s backwards;
  }

  /* ---------- main ---------- */
  #main { min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 40px); }
  .title { font-size: 28px; font-weight: 800; line-height: 1.3; letter-spacing: -.8px; margin: 4px 4px 24px; }
  .title small {
    display: inline-block; margin-left: 8px; vertical-align: 4px; padding: 5px 11px; border-radius: 99px;
    background: var(--ink); color: #fff; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .card { background: var(--card); border-radius: 22px; padding: 22px 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .wiz-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .wiz-back { width: 32px; height: 32px; margin-left: -6px; display: grid; place-items: center; border-radius: 50%; }
  .wiz-back:disabled { opacity: .2; }
  .wiz-back .ic { width: 22px; height: 22px; }
  .wiz-dots { flex: 1; display: flex; gap: 6px; }
  .wiz-dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; }
  .wiz-dots i.on { background: var(--accent); }
  #wizCount { font-size: 13px; font-weight: 700; color: var(--sub); font-variant-numeric: tabular-nums; }
  .wiz-vp { overflow: hidden; margin: 0 -20px; padding: 0 20px 4px; }
  .slide.next { animation: from-right .35s cubic-bezier(.2, .8, .2, 1); }
  .slide.prev { animation: from-left .35s cubic-bezier(.2, .8, .2, 1); }
  @keyframes from-right { from { transform: translateX(60%); opacity: 0; } }
  @keyframes from-left { from { transform: translateX(-60%); opacity: 0; } }
  .field h3 { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 18px; }
  .field h3 img, .tile { width: 32px; height: 32px; border-radius: 9px; object-fit: cover; flex: none; }
  .tile { display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .tile svg { width: 18px; height: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips label input { position: absolute; opacity: 0; pointer-events: none; }
  .chips label span {
    display: inline-block; padding: 10px 14px; border-radius: 99px; border: 1px solid var(--line);
    background: #fff; font-size: 15px; font-weight: 500; transition: .15s;
  }
  .chips label input:checked + span { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chips label input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .field h3 small { font-size: 13px; font-weight: 500; color: var(--sub); }
  .opts { display: grid; gap: 8px; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt > div {
    display: flex; align-items: center; gap: 12px; padding: 14px 14px 14px 16px; border-radius: 16px;
    background: #fff; border: 1.5px solid var(--line); transition: .15s;
  }
  .opt > div > span { flex: 1; min-width: 0; }
  .opt b { display: block; font-size: 15px; font-weight: 700; }
  .opt small { display: block; font-size: 13px; color: var(--sub); margin-top: 2px; line-height: 1.4; }
  .opt input:checked + div { border-color: var(--accent); background: var(--accent-soft); }
  .opt input:focus-visible + div { outline: 2px solid var(--accent); outline-offset: 2px; }
  .reel-btn {
    flex: none; display: grid; place-items: center; width: 34px; height: 34px;
    border-radius: 50%; background: var(--accent); color: #fff;
  }
  .reel-btn svg { width: 13px; height: 13px; margin-left: 2px; }
  #reel { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; background: rgba(0,0,0,.5); }
  .sheet {
    width: 100%; max-width: 430px; margin: 0 auto; background: #fff; border-radius: 22px 22px 0 0;
    padding: 12px 16px calc(env(safe-area-inset-bottom) + 16px); animation: up .25s ease-out;
  }
  @keyframes up { from { transform: translateY(100%); } }
  .sheet iframe { display: block; width: 100%; height: min(70dvh, 640px); border: 0; border-radius: 14px; background: var(--card); }
  .sheet-bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 12px; font-size: 15px; font-weight: 700; }
  .sheet-bar a { color: var(--accent); font-size: 14px; text-decoration: none; }
  .sheet .btn { margin-top: 12px; }
  .btn {
    display: block; width: 100%; padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 700;
    background: var(--accent); color: #fff; transition: transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: var(--card); color: var(--ink); }
  .card .btn { margin-top: 28px; }
  .row { display: flex; gap: 10px; }
  .row .btn.ghost { flex: 0 0 96px; }
  .shake { animation: shake .3s 2; }

  /* ticket */
  .ticket { background: var(--card); border-radius: 22px; overflow: hidden; margin-bottom: 16px; }
  .ticket-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; background: var(--accent); color: #fff; }
  .ticket-head b { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
  .ticket-head span { display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700; }
  .ticket-head span svg { width: 16px; height: 16px; }
  .timeline { position: relative; padding: 26px 20px 6px 68px; }
  .timeline::before { content: ''; position: absolute; left: 37px; top: 42px; width: 2px; height: 0; background: var(--accent); }
  .timeline.play::before { animation: draw 1.8s ease-out forwards; }
  @keyframes draw { to { height: calc(100% - 94px); } }
  .stop { position: relative; margin-bottom: 26px; opacity: 0; }
  .timeline.play .stop { animation: pop .4s forwards; }
  .timeline.play .stop:nth-child(2) { animation-delay: .8s; }
  .timeline.play .stop:nth-child(3) { animation-delay: 1.6s; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .stop img { position: absolute; left: -48px; top: 2px; width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--accent-soft); box-shadow: 0 0 0 4px var(--card); }
  .stop time { font-size: 13px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stop p { font-size: 17px; font-weight: 600; margin-top: 2px; }
  .perf { border-top: 2px dashed var(--line); margin: 0 18px; position: relative; }
  .perf::before, .perf::after { content: ''; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); }
  .perf::before { left: -30px; } .perf::after { right: -30px; }
  .no-capture { display: flex; align-items: center; gap: 12px; padding: 16px 20px; font-size: 15px; font-weight: 600; color: var(--sub); }
  .no-capture img { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; }

  /* letter */
  .countdown { text-align: center; }
  .countdown small { display: block; font-size: 14px; font-weight: 600; color: var(--sub); margin-bottom: 6px; }
  .countdown span { font-size: 40px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
  .safe { text-align: center; padding: 28px 20px 24px; }
  /* 닫힌 봉투: 봉투 이미지의 아래쪽 몸통(55%)만 보여주고 CSS 덮개를 씌움 */
  .safe .env {
    position: relative; display: block; margin: 0 auto; width: min(76%, 260px); aspect-ratio: 589 / 396;
    background: url(envelope.webp) center bottom / 100% auto no-repeat; perspective: 700px;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.15));
  }
  .safe .flap {
    position: absolute; left: 2%; right: 2%; top: 1%; height: 60%; z-index: 1;
    transform-origin: top; transition: transform .6s cubic-bezier(.4, 0, .2, 1);
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.35));
  }
  .safe .flap i { position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 50% 100%); background: linear-gradient(#6f5145, #4a3329); }
  .safe .lock {
    position: absolute; left: 50%; top: 61%; translate: -50% -50%; z-index: 2; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; background: var(--ink); color: #fff; box-shadow: 0 0 0 4px var(--card); transition: .4s;
  }
  .safe .lock svg { width: 20px; height: 20px; }
  .safe p { font-size: 15px; color: var(--sub); margin-top: 18px; line-height: 1.5; }
  .safe .btn { margin-top: 18px; animation: hbd-in .5s cubic-bezier(.3, 1.6, .5, 1); }
  /* 19시 지나면: 봉인(자물쇠) 풀리고 봉투가 둥실 */
  .safe.ready .lock { transform: scale(0) rotate(-45deg); opacity: 0; }
  .safe.ready .env { animation: env-bob 1.6s ease-in-out infinite; }
  @keyframes env-bob { 50% { transform: translateY(-8px) rotate(-2deg); } }
  /* 열기: 덮개가 젖혀지고(안의 편지지가 보임) → 봉투가 가라앉으며 사라짐 */
  .safe.opening .flap { transform: rotateX(180deg); }
  .safe.opening .env { animation: env-open .5s .7s forwards; }
  .safe.opening p, .safe.opening .btn { transition: opacity .3s; opacity: 0; }
  @keyframes env-open { to { transform: translateY(40px) scale(.6); opacity: 0; } }
  /* 편지지: 노트 이미지의 줄 간격(폭의 9.87%)에 글줄을 맞춤 */
  .letter-wrap { container-type: inline-size; margin-bottom: 16px; perspective: 1200px; }
  .letter {
    aspect-ratio: 9 / 16; padding: 63.5% 7% 12% 9%; border-radius: 6px;
    background: #f3f1eb url(letter_paper.webp) top / 100% auto no-repeat; box-shadow: 0 12px 30px rgba(0,0,0,.12);
    font-family: 'Nanum Pen Script', cursive; color: #2b3a67; white-space: pre-wrap; word-break: keep-all;
    font-size: 30px; line-height: 35px; font-size: 8.6cqw; line-height: 9.87cqw;
    transform-origin: top center; animation: unfold .9s cubic-bezier(.2, .8, .2, 1) backwards;
  }
  .letter span { display: block; min-height: 9.87cqw; animation: ink .5s backwards; }
  @keyframes unfold { from { transform: rotateX(-80deg) translateY(-30px); opacity: 0; } 40% { opacity: 1; } }
  @keyframes ink { from { opacity: 0; transform: translateY(6px); } }
  .dev-btn {
    position: fixed; right: 12px; top: calc(env(safe-area-inset-top) + 12px); z-index: 200;
    padding: 8px 12px; border-radius: 99px; background: #ffd400; color: #000; font-size: 13px; font-weight: 700;
    box-shadow: 0 2px 8px rgba(0,0,0,.2);
  }
  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 28px); transform: translateX(-50%);
    z-index: 90; background: rgba(25,25,25,.92); color: #fff; border-radius: 99px;
    padding: 12px 18px; font-size: 15px; font-weight: 600; white-space: nowrap; transition: opacity .3s; opacity: 0; pointer-events: none;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="app">

  <!-- 0. incoming / ongoing call -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-phone" viewBox="0 0 24 24"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></symbol>
    <symbol id="i-msg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3C6.5 3 2 6.6 2 11c0 2.4 1.3 4.6 3.4 6.1L4.5 21l4.2-2.3c1 .2 2.1.3 3.3.3 5.5 0 10-3.6 10-8s-4.5-8-10-8z"/></symbol>

  // 마림바 배음: 기음 + 약 4배음 + 약 10배음(타격음), 높은 배음일수록 빨리 사라짐
  [[1, .5, .5], [3.93, .18, .12], [9.2, .06, .04]].forEach(([mul, vol, len]) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = f * mul;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + .005);
    g.gain.exponentialRampToValueAtTime(.0001, t + len);
    o.connect(g).connect(out); o.start(t); o.stop(t + len);
  });
}
const RING = [[1318.5, 0], [987.77, .14], [830.61, .28], [987.77, .42], [1318.5, .56], [1108.7, .84], [987.77, .98], [1318.5, 1.12]];
let ringTimer, ringOut;
const ringAudio = RINGTONE_SRC ? Object.assign(new Audio(RINGTONE_SRC), { loop: true }) : null;
function startRingtone() {
  stopRingtone();
  if (ringAudio) { ringAudio.currentTime = 0; ringAudio.play().catch(() => {}); return; }
  if (!ac) return;
  ringOut = ac.createGain(); ringOut.gain.value = .6; ringOut.connect(ac.destination);
  const out = ringOut;
  const loop = () => {
    // 잠겨 있는 동안엔 예약하지 않음(풀리는 순간 한꺼번에 울리는 것 방지)
    if (ac.state === 'running') { const t = ac.currentTime + .05; RING.forEach(([f, dt]) => marimba(f, t + dt, out)); }
    ringTimer = setTimeout(loop, ac.state === 'running' ? 2000 : 200);
  };
  loop();
}
function stopRingtone() {
  ringAudio?.pause();
  clearTimeout(ringTimer);
  if (ringOut) { ringOut.gain.setTargetAtTime(0, ac.currentTime, .03); ringOut = null; }
}

function ring(i) {
  ci = i; caller = CALLERS[i]; accepted = ended = false;
  document.querySelectorAll('[data-name]').forEach(el => el.textContent = caller.name);
  // photo 있으면 프로필 사진 + 배경 포스터, 없으면 이니셜
  document.querySelectorAll('[data-avatar]').forEach(el => {
    el.style.backgroundImage = caller.photo ? `url("${caller.photo}")` : '';
    el.textContent = caller.photo ? '' : caller.avatar;
  });
  // 사진을 흐린 배경 포스터로 깔고 어둡게 덮어 흰 글씨가 잘 보이게
  $('#call').style.background = caller.photo ? `linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.65)), #000 url("${caller.photo}") center/cover` : '';
  $('#callTimer').textContent = '00:00';
  $('#subtitle').textContent = '';
  $('#knob').style.transform = '';
  $('#ongoing').classList.add('hidden');
  $('#incoming').classList.remove('hidden');
  startRingtone();
}
// 잠금화면 시계 → 터치하면 소리 켜고 첫 전화 울림
{
  const tickLock = () => {
    const d = new Date();
    $('#lockDate').textContent = d.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
    $('#lockTime').textContent = `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`;
  };
  tickLock();
  const clock = setInterval(tickLock, 1000);
  $('#lock').onclick = () => {
    ac?.resume();
    clearInterval(clock);
    $('#lock').classList.add('hidden');
    ring(0);
  };
}

function accept() {
  if (accepted) return;
  accepted = true;
  // 오디오는 사용자 제스처 안에서 열어둬야 나중에(통화 끝난 뒤) 소리가 남
  ac?.resume();
  stopRingtone();
  $('#reject').classList.add('hidden');
  $('#incoming').classList.add('hidden');
  $('#ongoing').classList.remove('hidden');

  let sec = 0;
  const fmt = n => String(n).padStart(2, '0');
  tick = setInterval(() => { sec++; $('#callTimer').textContent = `${fmt(sec / 60 | 0)}:${fmt(sec % 60)}`; }, 1000);

  // 자막 타이핑
  const sub = $('#subtitle'), line = caller.line; let i = 0;
  typer = setInterval(() => { sub.textContent = line.slice(0, ++i); if (i >= line.length) clearInterval(typer); }, 70);

  // TTS: iOS는 클릭 핸들러 안에서 바로 speak 해야 소리 남
  // 인앱 브라우저에서 onend가 안 오는 경우 대비해 길이 기반 타이머로도 종료
  fallback = setTimeout(endCall, line.length * 220 + 2500);
  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(line), me = ci;
    u.lang = 'ko-KR'; u.pitch = caller.pitch; u.rate = caller.rate;
    const v = speechSynthesis.getVoices().find(v => v.lang.startsWith('ko'));
    if (v) u.voice = v;
    u.onend = () => setTimeout(() => ci === me && endCall(), 600); // 이전 통화의 늦은 onend 무시
    speechSynthesis.speak(u);
  }
}
function endCall() {
  if (ended) return;
  ended = true;
  clearInterval(tick); clearInterval(typer); clearTimeout(fallback);
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  $('#callTimer').textContent = '통화 종료';
  if (ci < CALLERS.length - 1) setTimeout(() => ring(ci + 1), 900);
  else rush();
}
$('#btnEnd').onclick = endCall;
$('#btnForce').onclick = accept;
$('#btnReject').onclick = $('#btnMsg').onclick = () => $('#reject').classList.remove('hidden');

// 밀어서 응답하기: 끝까지 끌면 수락, 아니면 제자리로
{
  const knob = $('#knob'), slider = $('#slider');
  let x0 = null, dx = 0;
  const max = () => slider.clientWidth - knob.offsetWidth - 12;
  knob.onpointerdown = e => { x0 = e.clientX; knob.classList.remove('back'); knob.setPointerCapture(e.pointerId); };
  knob.onpointermove = e => {
    if (x0 === null) return;
    dx = Math.min(Math.max(e.clientX - x0, 0), max());
    knob.style.transform = `translateX(${dx}px)`;
  };
  knob.onpointerup = knob.onpointercancel = () => {
    if (x0 === null) return;
    x0 = null;
    if (dx > max() * .85) return accept();
    knob.classList.add('back'); knob.style.transform = ''; dx = 0;
  };
}

// ===== 0-1. rush =====
// 쿵(낮은음)/쾅(높은음 + 잡음) 번갈아 합성
function thump(big) {
  if (!ac) return;
  const t = ac.currentTime, out = ac.createGain();
  out.gain.setValueAtTime(big ? .9 : .7, t);
  out.gain.exponentialRampToValueAtTime(.001, t + .22);
  out.connect(ac.destination);
  const o = ac.createOscillator();
  o.frequency.setValueAtTime(big ? 190 : 130, t);
  o.frequency.exponentialRampToValueAtTime(40, t + .18);
  o.connect(out); o.start(t); o.stop(t + .22);
  if (!big) return;
  const n = ac.createBufferSource(), buf = ac.createBuffer(1, ac.sampleRate * .08, ac.sampleRate);
  buf.getChannelData(0).forEach((_, i, d) => d[i] = (Math.random() * 2 - 1) * (1 - i / d.length));
  n.buffer = buf; n.connect(out); n.start(t);
}
// 생일 축하 노래 (8비트 네모파). [음, 박자]
function playSong() {
  if (!ac) return;
  const hz = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
  const song = [
    ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['C5', 1], ['B4', 2],
    ['G4', .75], ['G4', .25], ['A4', 1], ['G4', 1], ['D5', 1], ['C5', 2],
    ['G4', .75], ['G4', .25], ['G5', 1], ['E5', 1], ['C5', 1], ['B4', 1], ['A4', 2],
    ['F5', .75], ['F5', .25], ['E5', 1], ['C5', 1], ['D5', 1], ['C5', 3],
  ];
  let t = ac.currentTime + .05;
  for (const [n, beats] of song) {
    const d = beats * .34, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = hz[n];
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.1, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + d * .95);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
    t += d;
  }
}

// 다가오기: 이동(좌우반전+쿵쾅) → 멈춤 → 이동 → 멈춤 → 코앞 → 해피버스데이
const wait = ms => new Promise(r => setTimeout(r, ms));
async function rush() {
  $('#rush').classList.remove('hidden');
  $('#call').classList.add('hidden');
  const zoom = $('.rush-zoom'), flip = $('.rush-flip');
  const move = async (scale, ms) => {
    let k = 0;
    thump(0);
    const flipper = setInterval(() => { flip.classList.toggle('m', ++k % 2); thump(k % 2); }, 180);
    zoom.style.transition = `transform ${ms}ms cubic-bezier(.4, 0, .6, 1)`;
    zoom.style.transform = `scale(${scale})`;
    await wait(ms);
    clearInterval(flipper);
    flip.classList.remove('m');
  };
  await wait(50);
  await move(.5, 700); await wait(700);
  await move(1, 700); await wait(700);
  await move(1.5, 500);
  thump(1); boom(); confettiRain(10000); playSong();
  $('#party').classList.remove('hidden');
}
$('#rushGo').onclick = () => {
  $('#rush').classList.add('hidden');
  $('#main').classList.remove('hidden');
  show('#plan');
};

// ===== 1. plan =====
const form = $('#planForm');
const pills = (key, list) => list.map(v => `<label><input type="radio" name="${key}" value="${v}"><span>${v}</span></label>`).join('');
const opts = (key, list) => list.map((o, i) => `<label class="opt"><input type="radio" name="${key}" value="${o.name}"><div><span><b>${o.name}</b><small>${o.desc}</small></span>${o.reel ? `<button type="button" class="reel-btn" data-reel="${key}:${i}" aria-label="${o.name} 릴스 보기"><svg><use href="#i-play"/></svg></button>` : ''}</div></label>`).join('');
$('[data-chips="time"]').innerHTML = pills('time', TIMES);
$('[data-chips="place"]').innerHTML = pills('place', Object.keys(AREAS));

// 한 화면에 질문 하나: 고르면 다음 질문으로 슬라이드
const slides = [...document.querySelectorAll('.slide')], dots = [...document.querySelectorAll('.wiz-dots i')];
let step = 0;
function go(n) {
  slides[step].classList.add('hidden');
  const s = slides[n];
  s.classList.remove('hidden', 'next', 'prev'); void s.offsetWidth; s.classList.add(n >= step ? 'next' : 'prev');
  step = n;
  dots.forEach((d, i) => d.classList.toggle('on', i <= n));
  $('#wizCount').textContent = `${n + 1}/${slides.length}`;
  $('#wizBack').disabled = n === 0;
  if (form.getBoundingClientRect().top < 0) form.scrollIntoView({ behavior: 'smooth' });
}
$('#wizBack').onclick = () => step && go(step - 1);

// 이미 고른 걸 다시 눌러도 넘어가게 change 말고 click으로 받음
let area, areaName;
function choose(input) {
  const { name, value } = input;
  if (name === 'place' && value !== areaName) {
    areaName = value; area = AREAS[value];
    $('#areaSub').textContent = area.sub;
    $('[data-opts="course"]').innerHTML = opts('course', area.course);
    $('[data-opts="dinner"]').innerHTML = opts('dinner', area.dinner);
  }
  const i = ['time', 'place', 'course'].indexOf(name);
  if (i >= 0) setTimeout(() => step === i && go(i + 1), 250);
}
form.addEventListener('click', e => { if (e.target.matches('input[type=radio]')) choose(e.target); });

// 릴스 보기: 버튼은 label 안의 버튼이라 눌러도 선택은 안 바뀜. 시트에서 '이걸로 할래'로 선택
const reelEmbed = url => {
  const m = url.match(/instagram\.com\/(reels?|p)\/([\w-]+)/);
  return m && `https://www.instagram.com/${m[1] === 'p' ? 'p' : 'reel'}/${m[2]}/embed/`;
};
let pick;
form.addEventListener('click', e => {
  const b = e.target.closest('[data-reel]');
  if (!b) return;
  const [key, i] = b.dataset.reel.split(':');
  const item = area[key][i], embed = reelEmbed(item.reel);
  if (!embed) return open(item.reel, '_blank');
  pick = { key, name: item.name };
  $('#reelTitle').textContent = item.name;
  $('#reelLink').href = item.reel;
  $('#reelFrame').src = embed;
  $('#reel').classList.remove('hidden');
});
const closeReel = () => { $('#reel').classList.add('hidden'); $('#reelFrame').src = 'about:blank'; };
$('#reelClose').onclick = closeReel;
$('#reel').onclick = e => { if (e.target === e.currentTarget) closeReel(); };
$('#reelPick').onclick = () => {
  const input = [...form.querySelectorAll(`input[name="${pick.key}"]`)].find(r => r.value === pick.name);
  input.checked = true;
  closeReel();
  choose(input);
};
function planStops(p) {
  const [h, m] = p.time.split(':').map(Number);
  const next = `${String(h + 1).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  return [[p.time, `${p.place} 만남`], [next, `${p.course} 데이트 시작`], ['18:30', `${p.dinner} 맛있는 저녁 식사`]];
}
let plan;
form.onsubmit = e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const p = Object.fromEntries(['time', 'place', 'course', 'dinner'].map(k => [k, f.get(k)]));
  if (Object.values(p).some(v => !v)) { shake(e.target); return toast('다 골라야 함'); }
  plan = p;
  planStops(p).forEach(([t, txt], i) => { $(`[data-t="${i}"]`).textContent = t; $(`[data-p="${i}"]`).textContent = txt; });
  show('#ticketView');
  const tl = $('#timeline'); tl.classList.remove('play'); void tl.offsetWidth; tl.classList.add('play');
};
$('#btnBack').onclick = () => show('#plan');

// ===== 2. decide + share =====
function share(p) {
  const text = '🎂 효섭 생일 데이트 확정!\n\n' + planStops(p).map(([t, s]) => `${t} ${s}`).join('\n');
  try {
    if (window.Kakao && KAKAO_JS_KEY) {
      if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
      return Kakao.Share.sendDefault({ objectType: 'text', text, link: { mobileWebUrl: location.href, webUrl: location.href } });
    }
  } catch (err) { console.warn(err); }
  if (navigator.share) return navigator.share({ text }).catch(() => {});
  navigator.clipboard?.writeText(text).then(() => toast('복사됨! 카톡에 붙여넣기 ㄱㄱ'));
}
$('#btnDecide').onclick = () => {
  share(plan);
  state = { ...state, confirmed: true, plan };
  save(state);
  boom();
  showLetter();
};

// ===== 3. letter =====
let cd;
function showLetter() {
  show('#letterView');
  $('#safe').className = 'card safe';
  $('#letterWrap').classList.add('hidden');
  $('#btnOpen').classList.add('hidden');
  const fmt = n => String(n).padStart(2, '0');
  const render = () => {
    const ms = openAt - Date.now();
    if (ms <= 0) {
      // 타이머 끝: 자물쇠 풀고 '편지 열어보기' 버튼 등장
      $('#cdLabel').textContent = '편지가 도착했어요';
      $('#cdText').textContent = 'OPEN!';
      $('#safeMsg').textContent = '19시가 됐어요! 편지를 열어보세요';
      $('#safe').classList.add('ready');
      $('#btnOpen').classList.remove('hidden');
      return clearInterval(cd);
    }
    const s = ms / 1000 | 0, d = s / 86400 | 0;
    $('#cdText').textContent = (d ? `${d}D ` : '') + `${fmt(s / 3600 % 24 | 0)}:${fmt(s / 60 % 60 | 0)}:${fmt(s % 60)}`;
  };
  clearInterval(cd); render(); cd = setInterval(render, 1000);
}
function openLetter() {
  const safe = $('#safe');
  if (safe.classList.contains('opening')) return;
  safe.classList.add('opening');
  setTimeout(() => {
    safe.classList.add('hidden');
    // 한 줄씩 써지듯 나타나게
    const l = $('#letter');
    l.replaceChildren(...LETTER.split('\n').map((line, i) => {
      const s = document.createElement('span');
      s.textContent = line;
      s.style.animationDelay = `${.8 + i * .12}s`;
      return s;
    }));
    $('#letterWrap').classList.remove('hidden');
    $('#letterWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
    boom();
  }, 1200);
}
$('#btnOpen').onclick = openLetter;
$('#btnSafe').onclick = () => {
  if (Date.now() >= openAt) return openLetter();
  shake($('#btnSafe'));
  toast('아직 안 열림 ㅋ 19시까지 기다려');
};
$('#btnReset').onclick = () => {
  if (!confirm('데이트 코스 다시 고를래?')) return;
  try { localStorage.removeItem(KEY); } catch {}
  state = {};
  clearInterval(cd);
  form.reset();
  areaName = null;
  go(0);
  show('#plan');
};

// ===== 개발용 편지 미리보기 (버튼 태그를 주석처리하면 같이 꺼짐) =====
$('#devLetter')?.addEventListener('click', () => {
  stopRingtone();
  ['#lock', '#call', '#reject', '#rush'].forEach(s => $(s).classList.add('hidden'));
  $('#main').classList.remove('hidden');
  showLetter();
  openLetter();
});
</script>
